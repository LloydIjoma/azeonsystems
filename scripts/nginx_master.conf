# Azeon Systems — wildcard-domain reverse proxy
# ================================================
# Fronts every tenant site (<slug>.azeonsystems.com.ng) plus the apex/
# frontend domain, terminating TLS with a single wildcard certificate and
# proxying through to the Frappe bench's own webserver.
#
# This is a HAND-WRITTEN template, not what `bench setup nginx` generates —
# that command's default output doesn't do wildcard TLS termination or a
# single dynamic block that dispatches every subdomain; this template does
# both, relying on Frappe's own Host-header-based site resolution to route
# each tenant to the right site under sites/.
#
# Deployed by scripts/setup_ssl.sh to /etc/nginx/sites-available/. Edit the
# copy in this repo and re-run setup_ssl.sh to redeploy — nginx does not
# read from this repo path directly. setup_ssl.sh also disables bench's
# auto-generated site file to avoid a server_name conflict with this one.
#
# DOMAIN placeholders below are literal "azeonsystems.com" — DO NOT edit
# them to "azeonsystems.com.ng" in this file; setup_ssl.sh pattern-matches
# on that exact literal and substitutes it with $DOMAIN (which now defaults
# to azeonsystems.com.ng) at deploy time.

upstream frappe_bench {
    # Matches the port Frappe's gunicorn/webserver process listens on
    # under bench (see the bench-generated supervisor config / Procfile).
    server 127.0.0.1:8000 fail_timeout=0;
}

upstream socketio_server {
    # Frappe's realtime (Socket.IO) server.
    server 127.0.0.1:9000 fail_timeout=0;
}

# ------------------------------------------------------------------
# HTTP -> HTTPS redirect for the apex domain and every tenant subdomain
# ------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name azeonsystems.com *.azeonsystems.com;

    # Kept for any future HTTP-01 fallback; the wildcard cert itself is
    # issued via DNS-01 (see scripts/setup_ssl.sh) and doesn't need this.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------
# HTTPS — one wildcard cert terminates TLS for every tenant subdomain
# ------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name azeonsystems.com *.azeonsystems.com;

    ssl_certificate     /etc/letsencrypt/live/azeonsystems.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azeonsystems.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    # Frappe's built static assets are shared across every site in one
    # bench — serve them directly instead of proxying, for every tenant.
    location /assets {
        alias /home/frappe/frappe-bench/sites/assets;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /socket.io {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_pass http://socketio_server;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name $host;
        proxy_read_timeout 120s;
        proxy_pass http://frappe_bench;

        # No per-tenant nginx config needed as new sites are provisioned —
        # Frappe resolves the tenant from this same $host header against
        # sites/<host>/, so this one block handles all of them.
    }
}
